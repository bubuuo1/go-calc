<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>오프라인 | 솔샘네 가계부</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7fb;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid #dbeafe;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 45px rgba(30, 64, 175, .12);
        text-align: center;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto;
        border-radius: 20px;
        background: #2563eb;
        color: #fff;
        font-size: 30px;
      }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0; color: #64748b; font-size: 14px; font-weight: 700; line-height: 1.7; }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 22px;
        border: 0;
        border-radius: 14px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">₩</div>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>
        이전에 열어 본 가계부 화면은 앱에서 다시 확인할 수 있습니다.
        연결되면 저장 대기 거래도 자동으로 동기화됩니다.
      </p>
      <button type="button" onclick="location.reload()">다시 연결하기</button>
    </main>
  </body>
</html>
